[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Registering custom markers to prevent Pytest warnings
markers =
    smoke: Fast sanity checks for importing and minimal runs.
    integration: Tests that component pipelines work together without isolated mocking.
    functional: Invariants and bound checks for specific functions or logic loops.
    regression: Checks to ensure old outputs or schemas are not broken by new code.
    static: Code-quality and dead-code scanning tests (vulture, import integrity).
    device: Hardware auditing tests (CPU, GPU, RAM availability).
    slow: Tests that might take longer than a few seconds.

# Keep output clean
addopts = -v --strict-markers
